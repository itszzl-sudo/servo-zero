[package]
name = "servo-bridge"
version = "0.1.0"
authors = ["Servo Developers"]
license = "MPL-2.0"
edition = "2021"
publish = false
rust-version = "1.70"
description = "Web to Native bridge layer for Servo engine - provides WebNativeBridge interface"

[lib]
name = "servo_bridge"
path = "lib.rs"
crate-type = ["rlib"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
