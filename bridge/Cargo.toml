[package]
name = "servo-bridge"
version = "0.1.0"
authors = ["Servo Developers"]
license = "MPL-2.0"
edition = "2021"
publish = false
rust-version = "1.70"
description = "Web to Native bridge layer - provides WebNativeBridge interface without SpiderMonkey"

[lib]
name = "servo_bridge"
path = "lib.rs"
crate-type = ["rlib"]

[features]
default = []
# 启用 HTML 支持（需要显式开启）
html = ["html-core"]
# 启用 embed 模式：禁用 HTML 支持，仅保留布局和 CSS
embed = []

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

# 独立核心组件（无 SpiderMonkey 依赖）
html-core = { path = "../components/html_core", optional = true }
css-core = { path = "../components/css_core", default-features = false }
layout-core = { path = "../components/layout_core", default-features = false }

# 渲染依赖
tiny-skia = "0.11"  # 2D 渲染
png = "0.17"       # PNG 编码
